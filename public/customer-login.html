<!doctype html>
<html lang="fil">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Customer Login | Leah Mae</title>
<style>
body{font-family:Arial,sans-serif;background:#f4f6fb;margin:0;padding:20px}
main{max-width:420px;margin:40px auto;background:white;padding:24px;border-radius:14px}
h1{font-size:24px;color:#243b70}
input,button{box-sizing:border-box;width:100%;padding:13px;margin:8px 0;border-radius:8px}
input{border:1px solid #ccc}
button{background:#243b70;color:white;border:0;font-weight:bold}
#msg{overflow-wrap:anywhere}
</style>
</head>
<body>
<main>
<h1>Leah Mae Online Assistance</h1>
<p>Mag-login sa iyong customer account.</p>
<form id="loginForm">
<input name="email" type="email" placeholder="Email address" required>
<input name="password" type="password" placeholder="Password" required>
<button type="submit">Mag-login</button>
</form>
<p id="msg"></p>
<p>Wala pang account? <a href="/customer-register.html">Gumawa ng Account</a></p>
</main>
<script>
document.getElementById('loginForm').addEventListener('submit',async function(e){
e.preventDefault();
const msg=document.getElementById('msg');
const form=new FormData(this);
msg.textContent='Sinusuri ang login...';
try{
const res=await fetch('/api/customer/login',{
method:'POST',
headers:{'Content-Type':'application/json'},
body:JSON.stringify({
email:form.get('email'),
password:form.get('password')
})
});
const data=await res.json();
if(!res.ok)throw new Error(data.message||'Hindi nagtagumpay ang login.');
msg.textContent='Matagumpay ang login.';
location.href='/customer-account.html';
}catch(err){
msg.textContent=err.message;
}
});
</script>
</body>
</html>
