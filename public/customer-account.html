<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Your Customer Dashboard | Leah Mae Online Assistance</title>
<style>

:root{color-scheme:light;--green:#163a35;--green2:#24574d;--cream:#f7f5ef;--ink:#202d2a;--muted:#687873;--line:#e4e9e5;--white:#fff}
*{box-sizing:border-box}
body{font-family:Inter,system-ui,-apple-system,"Segoe UI",Arial,sans-serif;background:var(--cream);margin:0;color:var(--ink);line-height:1.55}
header{background:linear-gradient(135deg,#163a35,#28584d);color:#fff;padding:25px 20px 30px}
header h2{max-width:900px;margin:0 auto;font-size:clamp(22px,4vw,30px);letter-spacing:-.5px}
header p{max-width:900px;margin:5px auto 0;color:#d9e8e1;font-size:14px}
main{max-width:900px;margin:22px auto;padding:0 16px 35px}
section{background:var(--white);padding:22px;margin:16px 0;border:1px solid var(--line);border-radius:18px;box-shadow:0 5px 22px #203b3010}
h3{font-size:18px;margin:0 0 14px;color:var(--green);letter-spacing:-.2px}
p{overflow-wrap:anywhere}
button,.primary-link{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:11px 16px;border:0;border-radius:10px;background:var(--green);color:#fff;font:inherit;font-weight:650;text-decoration:none;cursor:pointer}
button:hover,.primary-link:hover{background:var(--green2)}
button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid #8fc5ae;outline-offset:2px}
input{display:block;width:100%;min-height:45px;padding:11px 12px;margin:7px 0 15px;border:1px solid #d5ded8;border-radius:10px;background:#fff;color:var(--ink);font:inherit}
label{font-size:14px;font-weight:650;color:#34463f}
a{color:var(--green2);font-weight:600}
.item{padding:16px 0;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.item strong{font-size:16px;color:var(--green)}
.item p{margin:7px 0 12px;color:var(--muted);font-size:14px}
.muted,#profileMsg,#appointmentMsg{color:var(--muted);font-size:14px}
#profile{padding:12px 14px;background:#f5f8f5;border-radius:10px}
#msg{overflow-wrap:anywhere}
section>p:last-child{margin-bottom:0}
@media(min-width:650px){main{padding-left:22px;padding-right:22px}section{padding:26px}}
@media(max-width:480px){header{padding:22px 18px}main{margin:14px auto;padding:0 12px 24px}section{padding:18px;margin:12px 0;border-radius:15px}button,.primary-link{width:100%}}

</style>
</head>
<body>
<header>
<h2>Leah Mae Online Assistance</h2>
<p>Your Customer Dashboard</p>
</header>
<main>
<section>
<h3>My Profile</h3>
<p id="profile">Loading your profile...</p>
<form id="profileForm" hidden>
<label>Full Name</label>
<input name="fullName" required>
<label>Contact Number</label>
<input name="contact" required>
<label>Complete Complete Address</label>
<input name="address">
<button type="submit">Save Changes</button>
</form>
<p id="profileMsg"></p>
</section>
<section>
<p><a class="primary-link" href="/customer-messages.html">Open Private Messenger & My Files</a></p>
<h3>My Appointments</h3>
<p id="appointmentMsg">Loading your appointments...</p>
<div id="appointments"></div>
<p><a href="/application.html">Apply for Another Appointment</a></p>
</section>
<section>
<button id="logoutBtn">Sign Out</button>
<p><a href="/">Back to Home</a></p>
</section>
</main>
<script>
const profile=document.getElementById('profile');
const profileForm=document.getElementById('profileForm');
const profileMsg=document.getElementById('profileMsg');
const appointmentMsg=document.getElementById('appointmentMsg');
const appointments=document.getElementById('appointments');

async function loadAccount(){
try{
const r=await fetch('/api/customer/me');
const d=await r.json();
if(!r.ok)throw new Error('Please sign in to view your account.');
const c=d.customer;
profile.textContent=c.fullName+' | '+c.email;
profileForm.elements.fullName.value=c.fullName||'';
profileForm.elements.contact.value=c.contact||'';
profileForm.elements.address.value=c.address||'';
profileForm.hidden=false;
await loadAppointments();
}catch(e){
profile.textContent=e.message;
appointmentMsg.textContent='We couldn't load your appointments. Please try again.';
}
}

async function loadAppointments(){
try{
const r=await fetch('/api/customer/appointments');
const d=await r.json();
if(!r.ok)throw new Error(d.message||'Unable to load appointments.');
appointments.replaceChildren();
if(!d.appointments.length){
appointmentMsg.textContent='You don't have any appointments yet.';
return;
}
appointmentMsg.textContent='Total Appointments: '+d.appointments.length;
for(const a of d.appointments){
const item=document.createElement('div');
item.className='item';
const title=document.createElement('strong');
title.textContent=a.service||'Appointment';
item.appendChild(title);
const detail=document.createElement('p');
detail.textContent='Status: '+(a.status||'Pending')+
' | Date: '+(a.preferredDate||'Not set')+
' | Time: '+(a.preferredTime||'Not set');
item.appendChild(detail);

if (a.resultAvailable) {
const resultButton = document.createElement("button");
resultButton.type = "button";
resultButton.textContent = "View / Download Result";
resultButton.addEventListener("click", async function() {
resultButton.disabled = true;
resultButton.textContent = "Preparing secure link...";
try {
const response = await fetch("/api/customer/appointments/" + encodeURIComponent(a.id) + "/result");
const data = await response.json();
if (!response.ok) throw new Error(data.message || "Unable to access the result.");
window.location.assign(data.url);
} catch (error) {
alert(error.message || "Unable to download the result.");
resultButton.disabled = false;
resultButton.textContent = "View / Download Result";
}
});
item.appendChild(resultButton);
const fileName = document.createElement("p");
fileName.className = "muted";
fileName.textContent = a.resultOriginalName || "Result file available";
item.appendChild(fileName);
}

appointments.appendChild(item);
}
}catch(e){appointmentMsg.textContent=e.message;}
}
profileForm.addEventListener('submit',async function(e){
e.preventDefault();
profileMsg.textContent='Saving your changes...';
try{
const r=await fetch('/api/customer/profile',{
method:'PUT',
headers:{'Content-Type':'application/json'},
body:JSON.stringify({
fullName:profileForm.elements.fullName.value,
contact:profileForm.elements.contact.value,
address:profileForm.elements.address.value
})
});
const d=await r.json();
if(!r.ok)throw new Error(d.message||'Unable to save your profile.');
profileMsg.textContent='Your profile has been updated successfully.';
await loadAccount();
}catch(e){profileMsg.textContent=e.message;}
});

document.getElementById('logoutBtn').addEventListener('click',async function(){
try{
await fetch('/api/customer/logout',{method:'POST'});
location.href='/customer-login.html';
}catch(e){profileMsg.textContent='Unable to sign out. Please try again.';}
});

loadAccount();
</script>
</body>
</html>
