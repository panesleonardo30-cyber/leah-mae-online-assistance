<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign In | Leah Mae Online Assistance</title>
<style>

:root{color-scheme:light;--green:#163a35;--green2:#28584d;--cream:#f7f5ef;--ink:#202d2a;--muted:#687873;--line:#e0e7e1}
*{box-sizing:border-box}
body{font-family:Inter,system-ui,-apple-system,"Segoe UI",Arial,sans-serif;background:radial-gradient(circle at top left,#e1ece3 0,transparent 42%),var(--cream);margin:0;padding:20px;color:var(--ink);line-height:1.55;min-height:100vh;display:flex;align-items:center;justify-content:center}
main{width:100%;max-width:440px;margin:24px auto;background:#fff;padding:30px;border:1px solid var(--line);border-radius:22px;box-shadow:0 16px 50px #203b3014}
h1{font-size:clamp(24px,6vw,30px);line-height:1.2;color:var(--green);letter-spacing:-.7px;margin:0 0 10px}
p{color:var(--muted);font-size:14px}
form{margin-top:22px}
input,button{box-sizing:border-box;width:100%;min-height:48px;padding:13px 14px;margin:8px 0;border-radius:10px;font:inherit}
input{border:1px solid #d5ded8;background:#fff;color:var(--ink)}
input:focus-visible,button:focus-visible,a:focus-visible{outline:3px solid #8fc5ae;outline-offset:2px}
button{background:var(--green);color:#fff;border:0;font-weight:700;cursor:pointer}
button:hover{background:var(--green2)}
a{color:var(--green2);font-weight:650}
#msg{overflow-wrap:anywhere;min-height:22px}
@media(max-width:480px){body{padding:14px}main{padding:24px 20px;border-radius:18px}}

</style>
</head>
<body>
<main>
<h1>Leah Mae Online Assistance</h1>
<p>Sign in to manage your appointments and account.</p>
<form id="loginForm">
<input name="email" type="email" placeholder="Email Address" required>
<input name="password" type="password" placeholder="Password" required>
<button type="submit">Sign In</button>
</form>
<p id="msg"></p>
<p>Don't have an account? <a href="/customer-register.html">Create an Account</a></p>
</main>
<script>
document.getElementById('loginForm').addEventListener('submit',async function(e){
e.preventDefault();
const msg=document.getElementById('msg');
const form=new FormData(this);
msg.textContent='Signing you in...';
try{
const res=await fetch('/api/customer/login',{
method:'POST',
headers:{'Content-Type':'application/json'},
body:JSON.stringify({
email:form.get('email'),
password:form.get('password')
})
});
const data=await res.json();
if(!res.ok)throw new Error(data.message||'Sign-in failed. Please try again.');
msg.textContent='Sign-in successful. Redirecting...';
location.href='/customer-account.html';
}catch(err){
msg.textContent=err.message;
}
});
</script>
</body>
</html>
