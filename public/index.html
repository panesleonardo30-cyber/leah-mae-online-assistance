<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leah Mae Online Assistance</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            margin: 0;
            background: #f1f5f9;
            color: #1e293b;
            line-height: 1.5;
        }

        header {
            background: linear-gradient(135deg, #1d4ed8, #2563eb);
            color: white;
            text-align: center;
            padding: 30px 16px;
        }

        header h1 {
            margin: 0 0 8px;
            font-size: clamp(23px, 5vw, 32px);
        }

        header p {
            margin: 0;
            font-size: 15px;
        }

        .container {
            width: 100%;
            max-width: 600px;
            margin: 24px auto;
            padding: 0 15px;
        }

        .card {
            background: white;
            padding: 24px;
            border-radius: 16px;
            box-shadow: 0 6px 24px rgba(15, 23, 42, 0.08);
        }

        .card h2 {
            margin-top: 0;
            margin-bottom: 22px;
            color: #1d4ed8;
            font-size: 23px;
        }

        label {
            display: block;
            margin-top: 14px;
            margin-bottom: 6px;
            font-size: 14px;
            font-weight: 700;
            color: #334155;
        }

        input, select, textarea {
            display: block;
            width: 100%;
            max-width: 100%;
            padding: 13px 14px;
            margin: 0 0 14px;
            border: 1px solid #cbd5e1;
            border-radius: 9px;
            background: #fff;
            color: #0f172a;
            font: inherit;
            font-size: 16px;
        }

        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.13);
        }

        input[type="time"] {
            min-height: 52px;
            color: #0f172a;
            background-color: #ffffff;
            color-scheme: light;
            -webkit-appearance: auto;
            appearance: auto;
        }

        /* CUSTOM PREFERRED CLOCK */

#preferredTimeDisplay { cursor:pointer; }
#openTimePicker {
  width:100%; padding:12px; margin-bottom:16px;
  border:0; border-radius:9px; background:#1d4ed8;
  color:white; font-size:16px; font-weight:bold;
}
#clockOverlay {
  display:none; position:fixed; inset:0; z-index:99999;
  background:#0009; align-items:center; justify-content:center;
  padding:12px;
}
#clockOverlay.open { display:flex; }
#clockBox {
  width:100%; max-width:340px; background:white; color:#111827;
  border-radius:18px; padding:18px; text-align:center;
}
#clockDial {
  width:min(75vw,260px); height:min(75vw,260px);
  margin:16px auto; border-radius:50%; background:#e8eef8;
  position:relative;
}
#clockDial button {
  position:absolute; transform:translate(-50%,-50%);
  width:38px; height:38px; border:0; border-radius:50%;
  background:transparent; color:#111827; font-weight:bold;
}
#clockDial button.selected { background:#1d4ed8; color:white; }
#clockPreview { font-size:25px; font-weight:bold; margin:12px; }
#clockBox .clockAction {
  padding:11px; border-radius:8px; border:1px solid #ccc;
  font-size:16px; margin:4px;
}
#clockSet { background:#1d4ed8; color:white; }

        textarea {
            min-height: 90px;
            resize: vertical;
        }

        button {
            display: block;
            width: 100%;
            padding: 14px;
            margin-top: 10px;
            border: none;
            border-radius: 9px;
            background: #2563eb;
            color: white;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        button:disabled {
            opacity: 0.65;
            cursor: not-allowed;
        }

        #formMessage {
            overflow-wrap: anywhere;
        }

        @media (max-width: 480px) {
            header {
                padding: 24px 14px;
            }

            .container {
                margin: 16px auto;
                padding: 0 12px;
            }

            .card {
                padding: 19px 16px;
                border-radius: 12px;
            }

            .card h2 {
                font-size: 21px;
            }
        }
    
.leah-photo-wrap {
    text-align: center;
    margin: 10px auto 24px;
}
.leah-photo {
    display: block;
    width: 150px;
    height: 150px;
    max-width: 100%;
    object-fit: cover;
    border-radius: 50%;
    border: 4px solid #ffffff;
    box-shadow: 0 4px 14px rgba(0, 0, 0, 0.16);
    margin: 0 auto;
}
.leah-photo-caption {
    margin: 10px 0 0;
    font-weight: 600;
    color: #234b80;
}

/* CLOCK POLISH */
#clockAM,#clockPM{min-width:85px;min-height:44px;border-radius:24px;border:2px solid #2563eb;font-weight:bold;font-size:16px}
#clockAM.active,#clockPM.active{background:#2563eb!important;color:white!important}
#clockPreview{font-size:30px;font-weight:bold;text-align:center;padding:14px;border-radius:14px;background:#eff6ff;color:#1d4ed8;margin:12px 0}
#clockSet{background:#1d4ed8!important;color:white!important;font-weight:bold;min-height:46px;border-radius:12px}
</style>

    <meta name="theme-color" content="#1d4ed8">
    <link rel="manifest" href="/manifest.webmanifest">

</head>

<body>

<header>
    <h1>Leah Mae Online Assistance</h1>
    <p>Appointment and Online Assistance</p>
</header>

<div class="container">
    <div class="card">

        <div class="leah-photo-wrap">
            <img
                src="/leah-mae-photo.jpg"
                alt="Leah Mae Navarro"
                class="leah-photo"
            >
            <p class="leah-photo-caption">Leah Mae Navarro</p>
        </div>

        <h2>Book an Appointment</h2>

       <form id="appointmentForm">

    <label>Full Name</label>
    <input
        type="text"
        name="fullName"
        placeholder="Enter your name"
        required
    >

    <label>Service</label>
    <select name="service" required>
        <option value="">Select a service</option>
        <option value="Marina Appointment">Marina Appointment - ₱500</option>
        <option value="DFA Appointment">DFA Appointment - ₱350</option>
        <option value="PSA Appointment">PSA Appointment - ₱150</option>
        <option value="NBI Appointment">NBI Appointment - ₱350</option>
        <option value="Police Clearance">Police Clearance - ₱350</option>
        <option value="SSS/Pag-IBIG/PhilHealth Registration">
            SSS/Pag-IBIG/PhilHealth Registration - ₱300
        </option>
    </select>

    <label>
        Method of Payment <span class="required">*</span>
    </label>
    <select name="paymentMethod" required>
        <option value="">-- Select Payment Method --</option>
        <option value="GCash">GCash</option>
        <option value="Maya">Maya</option>
        <option value="Bank Transfer">Bank Transfer</option>
        <option value="Cash">Cash</option>
        <option value="Other">Other</option>
    </select>
    <p>Payment timing: <strong>After Approval</strong></p>
    <p>Payment instructions will be provided after your application is approved.</p>

    <label>Contact Number</label>
    <input
        type="tel"
        name="contact"
        placeholder="Enter your contact number"
        required
    >

    <label>Email Address</label>
    <input
        type="email"
        name="email"
        placeholder="example@gmail.com"
    >

    <label>Complete Address</label>
    <textarea
        name="address"
        placeholder="Enter your complete address"
        rows="3"
    ></textarea>

    <label>Preferred Date</label>
    <input
        type="date"
        name="preferredDate"
    >

    <label>Preferred Time</label>
<div class="preferred-time-row">
  <input type="text" id="preferredTimeDisplay"
    placeholder="Tap to choose time" readonly required>
  <input type="hidden" id="preferredTime" name="preferredTime">
  <button type="button" id="openTimePicker">Choose on Clock</button>
</div>
<label>Additional Message</label>
    <textarea
        name="message"
        placeholder="Additional information or request..."
        rows="3"
    ></textarea>

    <button type="submit">Submit Appointment</button>

</form>
<p id="formMessage" role="status" aria-live="polite"></p>

    </div>
</div>


<script>
const appointmentForm = document.getElementById("appointmentForm");
const formMessage = document.getElementById("formMessage");
let submittingAppointment = false;
let pendingAppointmentKey = null;

appointmentForm.addEventListener("submit", async function(event) {
    event.preventDefault();

    if (submittingAppointment) return;

    submittingAppointment = true;
    if (!pendingAppointmentKey) pendingAppointmentKey = crypto.randomUUID();
    const requestKey = pendingAppointmentKey;

    const button = appointmentForm.querySelector('button[type="submit"]');
    const originalText = button.textContent;

    button.disabled = true;
    button.textContent = "Submitting...";
    formMessage.textContent = "Submitting application...";

    try {
        const response = await fetch("/api/appointments", {
            method: "POST",
            body: (() => {
                const data = new FormData(appointmentForm);
                data.set("requestKey", requestKey);
                return new URLSearchParams(data);
            })()
        });

        const result = await response.json();

        if (!response.ok || !result.success) {
            throw new Error(result.message || "Submission failed.");
        }

        formMessage.textContent =
            result.message + " Reference number: " + result.id;
        formMessage.style.color = "green";
        appointmentForm.reset();
        pendingAppointmentKey = null;

    } catch (error) {
        formMessage.textContent =
            "Unable to confirm submission: " + error.message +
            ". Check your bookings before trying again.";
        formMessage.style.color = "red";

    } finally {
        submittingAppointment = false;
        button.disabled = false;
        button.textContent = originalText;
    }
});
</script>


<script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("/service-worker.js")
      .catch((error) => console.error("Service worker registration failed:", error));
  });
}
</script>


<div id="clockOverlay">
 <div id="clockBox" role="dialog" aria-modal="true">
  <h3>Choose Preferred Time</h3>
  <div id="clockPreview">09:00 AM</div>
  <button type="button" class="clockAction" id="clockAM">AM</button>
  <button type="button" class="clockAction" id="clockPM">PM</button>
  <div id="clockDial"></div>
  <p id="clockHint">Choose an hour</p>
  <button type="button" class="clockAction" id="clockCancel">Cancel</button>
  <button type="button" class="clockAction" id="clockSet">Set Time</button>
 </div>
</div>
<script>
(() => {
 const display=document.getElementById('preferredTimeDisplay');
 const field=document.getElementById('preferredTime');
 const overlay=document.getElementById('clockOverlay');
 const dial=document.getElementById('clockDial');
 const preview=document.getElementById('clockPreview');
 const hint=document.getElementById('clockHint');
 let hour=9, minute=0, period='AM', stage='hour', chosenMinute=false;

 function update(){
   preview.textContent=String(hour).padStart(2,'0')+':'+
     String(minute).padStart(2,'0')+' '+period;
   document.getElementById('clockAM').classList.toggle('active',period==='AM');
   document.getElementById('clockPM').classList.toggle('active',period==='PM');
 }
 function draw(){
   dial.innerHTML='';
   const values=stage==='hour'
     ?Array.from({length:12},(_,i)=>i+1)
     :Array.from({length:12},(_,i)=>i*5);
   values.forEach((v,i)=>{
     const a=(i*30-90)*Math.PI/180;
     const b=document.createElement('button');
     b.type='button';
     b.textContent=stage==='hour'?v:String(v).padStart(2,'0');
     b.style.left=(50+39*Math.cos(a))+'%';
     b.style.top=(50+39*Math.sin(a))+'%';
     if(stage==='hour'&&v===hour || stage==='minute'&&v===minute)
       b.classList.add('selected');
     b.onclick=()=>{
       if(stage==='hour'){
         hour=v; stage='minute'; chosenMinute=false;
         hint.textContent='Now choose minutes';
       }else{
         minute=v; chosenMinute=true;
         hint.textContent='Tap Set Time to confirm';
       }
       update(); draw();
     };
     dial.appendChild(b);
   });
 }
 function open(){
   const m=/^(\d{2}):(\d{2})$/.exec(field.value);
   if(m){
     let h=Number(m[1]); minute=Number(m[2]);
     period=h>=12?'PM':'AM'; hour=h%12||12;
     chosenMinute=true;
   }else{
     hour=9; minute=0; period='AM'; chosenMinute=false;
   }
   stage='hour'; hint.textContent='Choose an hour';
   update(); draw(); overlay.classList.add('open');
 }
 document.getElementById('openTimePicker').onclick=open;
 display.onclick=open;
 document.getElementById('clockAM').onclick=()=>{period='AM';update();};
 document.getElementById('clockPM').onclick=()=>{period='PM';update();};
 document.getElementById('clockCancel').onclick=()=>overlay.classList.remove('open');
 document.getElementById('clockSet').onclick=()=>{
   if(stage==='hour'){
     hint.textContent='Choose an hour, then minutes';
     return;
   }
   if(!chosenMinute){
     hint.textContent='Choose minutes on the clock first';
     return;
   }
   let h=hour%12+(period==='PM'?12:0);
   field.value=String(h).padStart(2,'0')+':'+String(minute).padStart(2,'0');
   display.value=String(hour).padStart(2,'0')+':'+
     String(minute).padStart(2,'0')+' '+period;
   overlay.classList.remove('open');
 };
 document.getElementById('appointmentForm').addEventListener('reset',()=>{
   field.value=''; display.value='';
 });
})();
</script>

</body>
</html>
